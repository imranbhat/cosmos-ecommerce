syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.cosmos.inventory.grpc";
option java_outer_classname = "InventoryProto";

package inventory;

// Inventory Service definition
service InventoryService {
    // Get inventory by product ID
    rpc GetInventory(GetInventoryRequest) returns (InventoryResponse);
    
    // Deduct quantity from inventory
    rpc DeductInventory(DeductInventoryRequest) returns (DeductInventoryResponse);
}

// Request message for getting inventory
message GetInventoryRequest {
    int64 product_id = 1;
}

// Response message containing inventory details
message InventoryResponse {
    int64 id = 1;
    int64 product_id = 2;
    int32 quantity = 3;
    bool found = 4;
}

// Request message for deducting inventory
message DeductInventoryRequest {
    int64 product_id = 1;
    int32 quantity = 2;
}

// Response message for deduction result
message DeductInventoryResponse {
    bool success = 1;
    string message = 2;
    int32 remaining_quantity = 3;
}
